files:
  exclude:
    - 'build/**/*'
    - 'tmp/**/*'
framework: actionview
linter:
  failLevel: hint
  rules:
    erb-no-javascript-tag-helper:
      enabled: false
    html-no-space-in-tag:
      enabled: false
    html-require-script-nonce:
      enabled: false
    html-no-unescaped-entities:
      exclude:
        - layouts/_dark_mode_toggle.html.erb
